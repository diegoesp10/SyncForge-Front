<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f3ee" />
    <title>SyncForge</title>
    <script>
      // Aplica el modo y el idioma guardados antes de pintar para evitar un destello
      try {
        if (localStorage.getItem('sf-mode') === 'night') document.documentElement.dataset.theme = 'night';
        var lang = localStorage.getItem('sf-lang');
        if (lang === 'es' || lang === 'en') document.documentElement.lang = lang;
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
